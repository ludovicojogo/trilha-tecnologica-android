name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build compatibility assets
        run: |
          npm install --no-save @babel/core@7 @babel/preset-env@7 tailwindcss@3.4.17
          node scripts/build-compat.js
          npx tailwindcss -c tailwind.config.js -i scripts/tailwind-input.css -o app/src/main/assets/tailwind.css --minify
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/tailwind.css
          test -s app/src/main/assets/confetti-lite.js
          if grep -q "oklch(" app/src/main/assets/tailwind.css; then
            echo "CSS incompatível detectado" >&2
            exit 1
          fi

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trilha-Tecnologica-Android-Compat
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 30
